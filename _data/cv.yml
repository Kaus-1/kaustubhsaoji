    Leadership and Service:
      - bullet: "**Science Lead**, Project Kratos — BITS Goa Mars Rover Team (2024–2025): led and mentored 50+ members in astrobiology research and life-detection experiments, and built ML pipelines for autonomous rock detection and classification."
      - bullet: "**Student Faculty Member**, Department of Biological Sciences, BITS Goa (2024–2025): represented student concerns in departmental decision-making alongside faculty."
      - bullet: "**Volunteer Teacher**, Nirmaan, BITS Goa (2022–2024): taught middle-school mathematics and science to children from an under-resourced community near campus."
      - bullet: "**Mentor**, Academic Assistance Program, BITS Goa (2023): mentored first-year students in General Biology."

