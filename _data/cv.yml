cv:
  name: Kaustubh Saoji
  label: Computational Protein & Peptide Design
  email: ksaoji@purdue.edu
  location: West Lafayette, IN, USA
  summary: >
    Computational biologist and dual-degree student working on de novo protein and peptide
    design. Thesis researcher at the Purdue Institute for Drug Discovery, with a background
    spanning generative models, molecular modeling, machine learning and the wet lab.

  social_networks:
    # - network: GitHub
    #   username: YOUR-GITHUB-USERNAME
